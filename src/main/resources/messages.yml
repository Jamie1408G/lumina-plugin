# Guiding players from the station to a place (/route <place>).
guide:
  hint: "&7Get off at &f{station}&7 and you'll be guided to {place}. &8(/route stop to stop)"
  hint-change: "&7When you get off at &f{station}&7, the way to your next platform is shown. &8(/route stop to stop)"
  start-change: "&a➜ Change to {line}&a towards &f{towards}&7: the platform is &f{distance} m&7 to the {direction}. Follow the green trail."
  change-here: "&e↔ Change here to {line}&e towards &f{towards}&e."
  platform-title: "{line}"
  platform-subtitle: "&7towards &f{towards}"
  # Boss bar during the trip, and while walking to the place. {arrow} points where to go.
  bar-waiting: "&bAlight at &f{station}&b for &f{place}"
  bar-change: "&bChange at &f{station}&b to {line} &btowards &f{towards}"
  bar-to-platform: "&a➜ {line} &atowards {towards} &f{distance} m &a{arrow}"
  bar: "&a➜ {place} &f{distance} m &a{arrow}"
  bar-other-world: "&7{place} is in another world"
  start: "&a➜ {place}&7 is &f{distance} m&7 to the {direction}. Follow the green trail and the bar at the top."
  arrived-title: "&a{place}"
  arrived-subtitle: "&7You've arrived"
  timeout: "&7Stopped guiding your journey."
  stopped: "&7Stopped guiding you."
  none: "&7You're not being guided anywhere. Plan a trip to a place with &f/route <place>"
  xaero-on: "&aDestinations will also be sent as Xaero's Minimap waypoints.&7 Click &f[Add]&7 in chat when it appears. Turn it off with &f/route xaero off"
  xaero-off: "&7Xaero's Minimap waypoints turned off."
  xaero-intro: "&7Waypoint for Xaero's Minimap:"

