# The Monthly Pass (a subscription): unlimited MRT and LRT rides.
pass:
  bought: "&aMonthly Pass bought for &f{price}&a: unlimited MRT and LRT rides for {days} days, until &f{until}&a. It renews by itself; stop that at a ticket machine or with &f/luminacard pass stop"
  card-included: "&aYour Monthly Pass comes with a Lumina Card: &f{id}&a."
  already: "&eYou already have a Monthly Pass until &f{until}&e ({renew}&e)."
  word-renews: "&erenews by itself"
  word-ends: "&eit doesn't renew"
  renewed: "&aYour Monthly Pass was renewed for &f{price}&a. Valid until &f{until}&a."
  renew-failed: "&cYour Monthly Pass ended: renewing costs &f{price}&c but your wallet has &f{balance}&c. Buy it again at a ticket machine."
  ended: "&7Your Monthly Pass has ended."
  none: "&7You don't have a Monthly Pass. Buy one for &f{price}&7 ({days} days) at a ticket machine or with &f/luminacard pass buy"
  renew-on: "&aYour Monthly Pass renews by itself (&f{price}&a) when it ends on &f{until}&a."
  renew-off: "&7Your Monthly Pass won't renew. It's still valid until &f{until}&7."
  disabled: "&cThe Monthly Pass isn't available."
  status-none: "&7none &8({price} for {days} days)"
  status-renews: "&avalid until {until}&7, renews"
  status-ends: "&evalid until {until}&7, ends then"
  info: "&6&lMonthly Pass&7: {status}\n &7Unlimited MRT and LRT rides for {days} days, &f{price}&7. &f/{label} pass buy&7, &fpass stop&7 (don't renew), &fpass renew"
  # In the card's trip history instead of a fare.
  history: "Monthly Pass"

city:
  welcome-title: "&b&lWelcome to Lumina"
  welcome-subtitle: "&7{district}"
  # Shown in chat every time, a moment after the welcome title.
  laws-hint: "Lumina has its own laws. Use &f/lulaws&7 to read them."
  leaving: "&7Leaving Lumina"
  district: "&b{district}"
  where: "You're {place}&7."
  where-city: "&bin Lumina"
  where-district: "&bin {district}"
  where-outside: "&8outside Lumina"
  need-selection: "&cSet two corners first with &f/lumina pos1&c and &f/lumina pos2&c (height doesn't matter)."
  # The city border is six points, set in order around the edge with /lumina pos1 to pos6.
  need-points: "&cStill missing: &f{missing}&c. Walk around Lumina's edge and stand on each corner in turn: &f/lumina pos1&c, &fpos2&c ... &fpos6&c. Then &f/lumina city set"
  points-world: "&cAll six points must be in the same world."
  same-spot: "&cpos{a} and pos{b} are on the same spot. Move one of them."
  crosses: "&cThe border crosses itself: the line pos{a} → pos{b} crosses pos{c} → pos{d}. Set the points in order around the edge (clockwise or anticlockwise), then &f/lumina city set&c again."
  flat: "&cThose points are all on one straight line, so there's nothing inside."
  set: "&aLumina's border is now &f{area}&a."
  set-show: "&7Check it with &f/lumina city show"
  info: "&b&lLumina&7: &f{area}&7, {districts} district(s). Change it with &f/lumina pos1&7 ... &fpos6&7 and &f/lumina city set"
  no-border: "&eNo city border yet. Walk around Lumina's edge and stand on each of its six corners in turn with &f/lumina pos1&e ... &fpos6&e, then &f/lumina city set"
  show: "&7Showing Lumina's border within {radius} blocks of you for {seconds} seconds. The nearest edge is &f{distance}&7 blocks away."
  show-other-world: "&eLumina's border is in world &f{world}&e."
  pos-list: "{list}"
  pos-cleared: "&7Positions cleared."
  district-usage: "Use &f/lumina district add <name>&7 (after pos1/pos2), &f/lumina district remove <name>&7 or &f/lumina district list"
  district-added: "&aDistrict &f{district}&a set to &f{area}&a. A smaller district inside a bigger one wins."
  district-removed: "&aDistrict &f{district}&a removed."
  district-unknown: "&cNo district called &f{district}&c. See &f/lumina district list"
  district-header: "&b&lDistricts&7: {count}"
  district-entry: " &f{district} &7{area}"

walkthrough:
  skipped: "Walkthrough skipped. See it again any time with &f/lumina walkthrough"
  # Each step is one screen: title, subtitle, and the same in chat to read back.
  # {base}, {step}, {blocks}, {max} and {incomplete} are the current fares.
  steps:
    - title: "&b&lWelcome to Lumina"
      subtitle: "&7Here's a quick tour of how the city works"
      chat: "&b&lWelcome to Lumina!&7 Here's a quick tour of how the city works.\n &8(Skip it with /lumina walkthrough skip)"
    - title: "&b&lLumina Card"
      subtitle: "&7Buy one with &f/luminacard buy"
      chat: "&b» Lumina Card:&7 buy one with &f/luminacard buy&7 or at a Card Machine, and top it up at a Top Up sign."
    - title: "&b&lMRT faregates"
      subtitle: "&7Right-click the gate with your card"
      chat: "&b» MRT:&7 right-click the faregate with your card in hand to tap in, and again at your destination to tap out. Green means go, red means no."
    - title: "&b&lFares"
      subtitle: "&7{base}, then +{step} every {blocks} blocks"
      chat: "&b» Fares:&7 {base} to start, plus {step} for every {blocks} blocks you travel, at most {max}. Forget to tap in or out and it costs {incomplete}."
    - title: "&b&lLRT"
      subtitle: "&7Pay when you get in the train"
      chat: "&b» LRT:&7 no gates. You pay the starting fare when you get in, and the rest when you get off. Same price as the MRT. Getting in without a valid card means a fine."
    - title: "&b&lPlan your trip"
      subtitle: "&f/route <from> <to>"
      chat: "&b» Journeys:&7 &f/route <from> <to>&7 plans a trip with transfers. You can type a place instead of a station too (see &f/metro places&7)."
    - title: "&b&lLumiCoins"
      subtitle: "&7Lumina's own money"
      chat: "&b» LumiCoins:&7 earn them with quests (&f/lquests&7) and city jobs, check your wallet with &f/lumicoins&7, and spend them on trips, the shop (&f/lumina shop&7) and apartments (&f/property&7)."
    - title: "&b&lCity jobs"
      subtitle: "&7Pick one with &f/luminajob"
      chat: "&b» Jobs:&7 join one with &f/luminajob join&7, go on duty to show you're available, and earn a salary. Need help? &f/luminajob request <job> <what you need>"
    - title: "&b&lLumina's laws"
      subtitle: "&7Read them with &f/lulaws"
      chat: "&b» Laws:&7 Lumina has its own laws. Read them any time with &f/lulaws&7."
    - title: "&a&lThat's it!"
      subtitle: "&7See this again any time: &f/lumina walkthrough"
      chat: "&aThat's the tour!&7 You can see this walkthrough again at any time by typing &f/lumina walkthrough&7."

fares:
  show: "&b&lFares &7(MRT and LRT)\n &7Start &f{base}&7, &f+{step}&7 every &f{blocks}&7 blocks, at least &f{min}&7, at most &f{max}\n &7Example: {ex1b} blocks &f{ex1}&7, {ex2b} blocks &f{ex2}&7, 1000 blocks &f{ex3}\n &7Incomplete trip &f{incomplete}&7, needed to tap in &f{enter}\n &8Change: /lumina fares set <name> <amount>"
