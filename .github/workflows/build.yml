name: Build Lumina

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show compile errors as annotations
        run: echo "::add-matcher::.github/maven-problem-matcher.json"

      - name: Build
        run: mvn -B -U package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Lumina
          path: target/Lumina.jar

      # Every push to main publishes the jar under Releases -> "latest".
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest target/Lumina.jar \
            --title "Lumina (latest build)" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Download Lumina.jar below and put it in your server's plugins folder." \
            --latest
